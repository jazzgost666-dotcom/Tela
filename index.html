<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmissão Simples</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
        video { width: 80%; max-width: 800px; background: #000; margin-top: 15px; border-radius: 8px; }
        button, input { padding: 10px; font-size: 16px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Transmissão de Tela Local</h1>
    <div id="setup">
        <input type="password" id="pass" placeholder="Senha (123)">
        <button onclick="iniciar()">Transmitir Minha Tela</button>
    </div>
    <br>
    <video id="preview" autoplay playsinline controls></video>

    <script>
        const senhaCorreta = "123"; // Defina sua senha aqui

        async function iniciar() {
            const digitada = document.getElementById('pass').value;
            if (digitada !== senhaCorreta) {
                alert("Senha incorreta!");
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                const videoElement = document.getElementById('preview');
                videoElement.srcObject = stream;

                // Se fechar a aba ou parar o compartilhamento pelo navegador, limpa a tela
                stream.getVideoTracks()[0].onended = () => {
                    videoElement.srcObject = null;
                    alert("Transmissão encerrada.");
                };
            } catch (e) {
                alert("Erro ao capturar a tela.");
            }
        }
    </script>
</body>
</html>
